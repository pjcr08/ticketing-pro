<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festivals & Tickets - Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-attachment: fixed;
            margin: 0;
            padding: 40px 20px;
            color: #fff;
            min-height: 100vh;
        }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 2.8em; margin: 0; background: linear-gradient(45deg, #ff007f, #7928ca); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
        p.subtitle { color: #a0aec0; font-size: 1.1em; margin-top: 10px; }
        
        .event-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }
        .event-card:hover { transform: translateY(-5px); }
        .event-title { margin-top: 0; color: #fff; font-size: 1.8em; font-weight: 600; }
        .event-info { color: #cbd5e0; margin: 8px 0; font-size: 0.95em; }
        
        .ticket-option {
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 20px;
            padding-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .ticket-info { flex: 1; min-width: 200px; }
        .ticket-name { font-size: 1.1em; font-weight: 600; color: #ff007f; display: block; }
        .price { font-size: 1.3em; font-weight: bold; color: #00ffcc; }
        
        form { display: flex; gap: 10px; flex-wrap: wrap; width: 100%; margin-top: 10px; }
        input {
            flex: 1;
            min-width: 180px;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }
        input::placeholder { color: #a0aec0; }
        input:focus { outline: none; border-color: #ff007f; }
        
        button {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .status { text-align: center; font-size: 1.2em; color: #a0aec0; margin-top: 40px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Próximos Festivales</h1>
            <p class="subtitle">Consigue tus entradas oficiales de forma rápida y segura</p>
        </header>

        <div id="lista-eventos" class="status">Cargando eventos...</div>
    </div>

    <script>
        const API_URL = 'https://ticketing-pro.onrender.com';

        async function cargarEventos() {
            const contenedor = document.getElementById('lista-eventos');
            try {
                const response = await fetch(`${API_URL}/api/eventos`);
                const eventos = await response.json();

                if (!eventos || eventos.length === 0) {
                    contenedor.innerHTML = '<p>No hay festivales disponibles en este momento.</p>';
                    return;
                }

                contenedor.innerHTML = '';
                eventos.forEach(evento => {
                    let entradasHtml = '';
                    if (evento.tipos_entrada && evento.tipos_entrada.length > 0) {
                        evento.tipos_entrada.forEach(tipo => {
                            entradasHtml += `
                                <div class="ticket-option">
                                    <div class="ticket-info">
                                        <span class="ticket-name">🎟️ ${tipo.nombre}</span>
                                        <span class="price">${tipo.precio} €</span>
                                    </div>
                                    <form onsubmit="comprarEntrada(event, ${tipo.id})">
                                        <input type="text" name="nombre" placeholder="Tu nombre" required>
                                        <input type="email" name="email" placeholder="Tu correo electrónico" required>
                                        <button type="submit">Comprar</button>
                                    </form>
                                </div>
                            `;
                        });
                    } else {
                        entradasHtml = '<p style="color: #a0aec0; margin-top: 15px;"><em>Entradas próximamente a la venta.</em></p>';
                    }

                    contenedor.innerHTML += `
                        <div class="event-card">
                            <h2 class="event-title">${evento.titulo}</h2>
                            <p class="event-info">${evento.descripcion}</p>
                            <p class="event-info">📍 <strong>Lugar:</strong> ${evento.lugar}</p>
                            <p class="event-info">📅 <strong>Fecha:</strong> ${new Date(evento.fecha).toLocaleString()}</p>
                            ${entradasHtml}
                        </div>
                    `;
                });
            } catch (error) {
                contenedor.innerHTML = '<p style="color: #ff4d4d;">Error al conectar con el servidor de festivales.</p>';
                console.error(error);
            }
        }

        async function comprarEntrada(event, tipoEntradaId) {
            event.preventDefault();
            const form = event.target;
            const nombre = form.nombre.value;
            const email = form.email.value;

            try {
                const response = await fetch(`${API_URL}/api/crear-pago`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tipo_entrada_id: tipoEntradaId,
                        cantidad: 1,
                        comprador_nombre: nombre,
                        comprador_email: email
                    })
                });

                const data = await response.json();
                if (data.url) {
                    window.location.href = data.url;
                } else {
                    alert('Error al procesar el pago: ' + (data.error || 'Inténtalo de nuevo.'));
                }
            } catch (err) {
                alert('Hubo un problema al conectar con la pasarela de pago.');
            }
        }

        cargarEventos();
    </script>
</body>
</html>
