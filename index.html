<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próximos Eventos - Villafranca de Córdoba</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            margin: 0;
            padding: 40px 20px;
            color: #fff;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-image 1.2s ease-in-out;
            background-color: #0f0c29;
        }
        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 8, 25, 0.82);
            z-index: -1;
        }
        .container { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }
        header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 3em; margin: 0; background: linear-gradient(45deg, #ff007f, #00ffcc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
        p.subtitle { color: #a0aec0; font-size: 1.1em; margin-top: 10px; }
        
        /* Vista de cuadrícula de eventos */
        .event-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }
        .event-thumb {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }
        .event-thumb:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(255, 0, 127, 0.3);
            border-color: #ff007f;
        }
        .thumb-poster { width: 100%; height: 220px; object-fit: cover; }
        .thumb-content { padding: 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .thumb-title { font-size: 1.3em; font-weight: 700; margin: 0; color: #fff; }
        .thumb-date { color: #00ffcc; font-size: 0.9em; font-weight: 600; }
        .thumb-location { color: #a0aec0; font-size: 0.9em; }

        /* Vista detallada del evento seleccionado */
        .event-detail-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .detail-header { display: flex; gap: 25px; flex-wrap: wrap; align-items: flex-start; }
        .event-poster { width: 220px; height: 300px; object-fit: cover; border-radius: 12px; border: 2px solid rgba(255,255,255,0.2); box-shadow: 0 5px 15px rgba(0,0,0,0.4); }
        .event-details { flex: 1; min-width: 250px; }
        .event-title { margin: 0 0 15px 0; color: #fff; font-size: 2.2em; font-weight: 800; }
        .event-info { color: #cbd5e0; margin: 8px 0; font-size: 1.05em; line-height: 1.5; }
        
        .ticket-option {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .ticket-info { flex: 1; min-width: 180px; }
        .ticket-name { font-size: 1.2em; font-weight: 700; color: #ff007f; display: block; }
        .price { font-size: 1.4em; font-weight: 800; color: #00ffcc; }
        
        form { display: flex; gap: 10px; flex-wrap: wrap; width: 100%; margin-top: 10px; }
        input {
            flex: 1; min-width: 160px; padding: 12px 15px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px; color: #fff; font-size: 14px;
        }
        input::placeholder { color: #a0aec0; }
        input:focus { outline: none; border-color: #ff007f; }
        
        button {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            color: white; border: none; padding: 12px 25px;
            border-radius: 8px; font-weight: 700; cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        button:hover { opacity: 0.9; transform: scale(1.02); }
        
        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; padding: 10px 20px; border-radius: 8px;
            cursor: pointer; font-weight: 600; margin-bottom: 20px;
            display: inline-flex; align-items: center; gap: 8px;
            transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .status { text-align: center; font-size: 1.2em; color: #a0aec0; margin-top: 40px; }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>
    <div class="container">
        <header>
            <h1>PRÓXIMOS EVENTOS</h1>
            <p class="subtitle">Descubre los eventos y fiestas de Villafranca de Córdoba</p>
        </header>
        <div id="app-content" class="status">Cargando eventos...</div>
    </div>

    <script>
        const API_URL = '';
        // Fotos del entorno y naturaleza de Villafranca de Córdoba y el Guadalquivir
        const fondos = [
            'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Puente_de_Hierro_en_Villafranca_de_C%C3%B3rdoba.jpg/1280px-Puente_de_Hierro_en_Villafranca_de_C%C3%B3rdoba.jpg',
            'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Rio_Guadalquivir_en_Villafranca_de_C%C3%B3rdoba.jpg/1280px-Rio_Guadalquivir_en_Villafranca_de_C%C3%B3rdoba.jpg',
            'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80',
            'https://images.unsplash.com/photo-1511497584788-876761c119ee?auto=format&fit=crop&w=1920&q=80'
        ];
        let bgIndex = 0;
        function cambiarFondo() {
            document.body.style.backgroundImage = `url('${fondos[bgIndex]}')`;
            bgIndex = (bgIndex + 1) % fondos.length;
        }
        cambiarFondo();
        setInterval(cambiarFondo, 6000);

        let eventosGlobales = [];
        let eventoSeleccionadoId = null;

        async function cargarEventos() {
            const contenedor = document.getElementById('app-content');
            try {
                const response = await fetch(`${API_URL}/api/eventos`);
                eventosGlobales = await response.json();

                renderizarVista();
            } catch (error) {
                contenedor.innerHTML = '<p style="color: #ff4d4d;">Error al conectar con el servidor.</p>';
            }
        }

        function renderizarVista() {
            const contenedor = document.getElementById('app-content');

            if (!eventosGlobales || eventosGlobales.length === 0) {
                contenedor.innerHTML = '<p>No hay eventos disponibles en este momento en Villafranca de Córdoba.</p>';
                return;
            }

            if (eventoSeleccionadoId !== null) {
                const evento = eventosGlobales.find(e => e.id === eventoSeleccionadoId);
                if (!evento) {
                    eventoSeleccionadoId = null;
                    renderizarVista();
                    return;
                }

                let entradasHtml = '';
                if (evento.tipos_entrada && evento.tipos_entrada.length > 0) {
                    evento.tipos_entrada.forEach(tipo => {
                        entradasHtml += `
                            <div class="ticket-option">
                                <div class="ticket-info">
                                    <span class="ticket-name">🎟️ ${tipo.nombre}</span>
                                    <span class="price">${tipo.precio} €</span>
                                </div>
                                <form onsubmit="comprarEntrada(event, ${tipo.id})">
                                    <input type="text" name="nombre" placeholder="Tu nombre" required>
                                    <input type="email" name="email" placeholder="Tu correo electrónico" required>
                                    <button type="submit">Comprar</button>
                                </form>
                            </div>
                        `;
                    });
                } else {
                    entradasHtml = '<p style="color: #a0aec0; margin-top: 15px;"><em>Entradas próximamente a la venta.</em></p>';
                }

                const cartelImg = evento.cartel_url ? `<img src="${evento.cartel_url}" class="event-poster" alt="Cartel">` : '';

                contenedor.innerHTML = `
                    <button class="back-btn" onclick="volverAlListado()">← Volver a todos los eventos</button>
                    <div class="event-detail-card">
                        <div class="detail-header">
                            ${cartelImg}
                            <div class="event-details">
                                <h2 class="event-title">${evento.titulo}</h2>
                                <p class="event-info">${evento.descripcion}</p>
                                <p class="event-info">📍 <strong>Lugar:</strong> ${evento.lugar}, Villafranca de Córdoba</p>
                                <p class="event-info">📅 <strong>Fecha:</strong> ${new Date(evento.fecha).toLocaleString()}</p>
                            </div>
                        </div>
                        <div class="ticket-section">
                            <h3 style="margin-top:0; color:#00ffcc;">Selecciona tus entradas</h3>
                            ${entradasHtml}
                        </div>
                    </div>
                `;
                return;
            }

            let gridHtml = '<div class="event-grid">';
            eventosGlobales.forEach(evento => {
                const img = evento.cartel_url ? evento.cartel_url : 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=600&q=80';
                gridHtml += `
                    <div class="event-thumb" onclick="seleccionarEvento(${evento.id})">
                        <img src="${img}" class="thumb-poster" alt="Cartel evento">
                        <div class="thumb-content">
                            <h3 class="thumb-title">${evento.titulo}</h3>
                            <span class="thumb-date">📅 ${new Date(evento.fecha).toLocaleDateString()}</span>
                            <span class="thumb-location">📍 ${evento.lugar}</span>
                        </div>
                    </div>
                `;
            });
            gridHtml += '</div>';
            contenedor.innerHTML = gridHtml;
        }

        function seleccionarEvento(id) {
            eventoSeleccionadoId = id;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            renderizarVista();
        }

        function volverAlListado() {
            eventoSeleccionadoId = null;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            renderizarVista();
        }

        async function comprarEntrada(event, tipoEntradaId) {
            event.preventDefault();
            const form = event.target;
            const nombre = form.nombre.value;
            const email = form.email.value;

            try {
                const response = await fetch(`${API_URL}/api/crear-pago`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tipo_entrada_id: tipoEntradaId, cantidad: 1, comprador_nombre: nombre, comprador_email: email })
                });
                const data = await response.json();
                if (data.url) { window.location.href = data.url; }
                else { alert('Error: ' + (data.error || 'Inténtalo de nuevo.')); }
            } catch (err) {
                alert('Error al conectar con la pasarela de pago.');
            }
        }

        cargarEventos();
    </script>
</body>
</html>
